[package]
name = "ytop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "htop + fleet rows + booter for yggterm — machines, agent rows, and supervision as a libyggterm document-surface app"
repository = "https://github.com/yggdrasilhq/ytop"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ytrace = { git = "https://github.com/yggdrasilhq/ytrace", branch = "main" }

[profile.release]
strip = true
lto = "thin"
