[package]
name = "yggtopo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "lstopo + htop for a yggterm fleet — the topology of your machines, their containers and their live processes, as a libyggterm document-surface app"
repository = "https://github.com/yggdrasilhq/yggtopo"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
